<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>使用テキスト一覧・購入申請</title>
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="./style.css">
</head>
<body data-site-home="../">
<div id="app">
<div data-site-header></div>

<main id="listPage" class="content">
  <div class="list-actions">
    <button id="purchaseNav" class="purchase-nav" type="button">🛒 テキスト購入申請</button>
  </div>
  <div class="filters">
    <select id="levelFilter"><option value="">すべての区分</option><option>小学生</option><option>中学生</option><option>高校生</option></select>
    <select id="subjectFilter"><option value="">すべての科目</option><option>国語</option><option>数学</option><option>英語</option><option>理科</option><option>社会</option><option>英語・数学</option></select>
    <select id="gradeFilter"><option value="">すべての学年</option><option>全学年</option><option>1年</option><option>2年</option><option>3年</option><option>4年</option><option>5年</option><option>6年</option><option>新中1</option><option>新高1</option></select>
  </div>
  <div id="textbookNotice" class="notice"></div>
  <div id="textbooks"></div>
</main>

<main id="purchasePage" class="content hidden">
  <h2>🛒 テキスト購入申請</h2>
  <section class="card">
    <h3>生徒情報</h3>
    <label>生徒番号 <b>必須</b><input id="studentId" inputmode="numeric" placeholder="生徒番号"></label>
    <label>生徒氏名 <b>必須</b><input id="studentName" placeholder="生徒氏名"></label>
  </section>
  <section class="card">
    <h3>購入するテキスト</h3>
    <div id="items"></div>
    <button id="addItem" class="outline">＋ テキストを追加する</button>
  </section>
  <section class="card">
    <h3>その他</h3>
    <label>連絡事項<textarea id="notes" placeholder="連絡事項があれば入力してください。"></textarea></label>
    <label>確認メール送信用メールアドレス <b>必須</b><input id="email" type="email" placeholder="example@example.com"></label>
  </section>
  <div class="buttons"><button id="backList" class="secondary">戻る</button><button id="preview" class="primary">確認</button></div>
</main>

<main id="previewPage" class="content hidden">
  <h2>📝 購入申請内容の確認</h2>
  <section class="card" id="previewBox"></section>
  <div class="buttons"><button id="edit" class="secondary">戻って修正</button><button id="submit" class="primary">申請する</button></div>
  <p class="fallback-link">エラーの場合はこちら<br><a href="https://forms.gle/9hMNqdQ7cvri2mmQA" target="_blank" rel="noopener">https://forms.gle/9hMNqdQ7cvri2mmQA</a></p>
  <div id="loading" class="loading hidden">送信しています。しばらくお待ちください。</div>
</main>

<main id="completePage" class="content hidden">
  <section class="complete"><div class="icon">✅</div><h2>購入申請を受け付けました。</h2>
  <p>入力いただいたメールアドレスに受付確認メールを送信しています。</p>
  <p>テキスト代は通常授業料と合わせて口座引き落としとなり、お支払い確認後に教室で直接お渡しいたします。</p>
  <p>お急ぎの場合は、教室まで直接ご連絡ください。</p>
  <button id="completeBack" class="primary">使用テキスト一覧へ戻る</button></section>
</main>
</div>
<script src="../common.js"></script>
<script src="./script.js"></script>
</body>
</html>
