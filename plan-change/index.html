<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プラン変更申請 | RED天王台教室</title><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="./style.css?v=20261009-2"></head><body data-site-home="../"><div data-site-header></div><main class="content"><h2>🔄 プラン変更申請</h2><form id="form"><div data-common-block="student-info"></div><section class="card"><label>現在のプラン <b>必須</b><select id="currentPlan"><option value="">選択してください</option><option>通い放題</option><option>週4/6プラン</option><option>週1</option><option>週2</option><option>週3</option><option>週4</option><option>週5</option><option>週6</option></select></label><fieldset><legend>現在の受講教科 <b>必須</b></legend><div id="currentSubjects" class="checks"></div></fieldset><label>来月以降のプラン <b>必須</b><select id="nextPlan"><option value="">選択してください</option><option>通い放題</option><option>週4/6プラン</option><option>週1</option><option>週2</option><option>週3</option><option>週4</option><option>週5</option><option>週6</option></select></label><p id="packLockNotice" class="pack-lock-notice hidden" role="status">パックは年度内変更することができません。来月以降もパックを選択してください。</p><fieldset><legend>来月以降の受講教科 <b>必須</b></legend><div id="nextSubjects" class="checks"></div></fieldset></section><section id="planNotice" class="card plan-notice hidden" aria-labelledby="planNoticeTitle"><h3 id="planNoticeTitle">⚠️ パック・通い放題プランの注意事項</h3><p>内容を確認し、各項目にチェックを入れてください。</p><div id="planNoticeItems" class="plan-notice-items"></div><p id="planNoticeError" class="error" role="alert"></p></section><div data-common-block="other"></div><div class="buttons"><button class="primary" type="submit">確認画面へ</button></div></form><section id="confirm" class="card hidden"><h2>入力内容の確認</h2><div id="summary"></div><div class="actions"><button id="back" class="secondary" type="button">入力に戻る</button><button id="submit" class="primary" type="button">この内容で申請する</button></div><p id="loading" class="hidden">申請しています…</p></section><section id="success" class="card hidden"><h2>✓ 申請しました</h2><p>プラン変更申請を受け付けました。</p></section></main><script src="../common.js"></script><script src="./script.js?v=20261009-3"></script></body></html>
