<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プラン変更申請 | RED天王台教室</title><link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="./style.css"></head><body><header class="site-banner"><div class="site-banner-inner"><a class="site-logo-link" href="../"><img class="site-logo" src="../assets/red-logo.png" alt="自立学習RED"></a></div></header><main class="page"><section class="card"><h1>🔄 プラン変更申請</h1><p>来月以降の受講プラン・受講教科の変更を申請してください。</p></section><form id="form" class="card"><label>生徒番号 <b>必須</b><input id="studentId" inputmode="numeric"></label><label>氏名 <b>必須</b><input id="studentName"></label><label>現在のプラン <b>必須</b><select id="currentPlan"><option value="">選択してください</option><option>通い放題</option><option>週4/6プラン</option><option>週1</option><option>週2</option><option>週3</option><option>週4</option><option>週5</option><option>週6</option></select></label><fieldset><legend>現在の受講教科 <b>必須</b></legend><div id="currentSubjects" class="checks"></div></fieldset><label>来月以降のプラン <b>必須</b><select id="nextPlan"><option value="">選択してください</option><option>通い放題</option><option>週4/6プラン</option><option>週1</option><option>週2</option><option>週3</option><option>週4</option><option>週5</option><option>週6</option></select></label><fieldset><legend>来月以降の受講教科 <b>必須</b></legend><div id="nextSubjects" class="checks"></div></fieldset><label>連絡事項<textarea id="notes" rows="4"></textarea></label><label>確認メール送付先 <b>必須</b><input id="email" type="email" autocomplete="email"></label><p id="error" class="error"></p><button class="primary" type="submit">確認画面へ</button></form><section id="confirm" class="card hidden"><h2>入力内容の確認</h2><div id="summary"></div><div class="actions"><button id="back" class="secondary" type="button">入力に戻る</button><button id="submit" class="primary" type="button">この内容で申請する</button></div><p id="loading" class="hidden">申請しています…</p></section><section id="success" class="card hidden"><h2>✓ 申請しました</h2><p>プラン変更申請を受け付けました。</p></section></main><script src="./script.js"></script><script src="../common.js"></script></body></html>
