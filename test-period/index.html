<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>テスト対策コマ登録 | RED天王台教室</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="../common.css"></head><body data-site-home="../"><div data-site-header></div><main class="page"><section class="card"><h1>⏰ テスト対策コマ登録</h1><p>開始日から2週間分の受講コマを選択してください。</p></section><form id="form" class="card"><label>生徒番号 <b>必須</b><input id="studentId" inputmode="numeric"></label><label>氏名 <b>必須</b><input id="studentName"></label><div class="two"><label>学校名 <b>必須</b><select id="school"></select></label><label>学年 <b>必須</b><select id="grade"></select></label></div><label>2週間の開始日 <b>必須</b><input id="startDate" type="date"></label><div id="calendarWrap"></div><label>連絡事項<textarea id="notes" rows="4"></textarea></label><label>メールアドレス <b>必須</b><input id="email" type="email"></label><p id="error" class="error"></p><button class="primary" type="submit">確認画面へ</button></form><section id="confirm" class="card hidden"><h2>入力内容の確認</h2><div id="summary"></div><div class="actions"><button id="back" class="secondary">入力に戻る</button><button id="submit" class="primary">この内容で登録する</button></div><p id="loading" class="hidden">登録しています…</p></section><section id="success" class="card hidden"><h2>✓ 登録しました</h2><p>テスト対策コマの登録を受け付けました。</p></section></main><script src="../common.js"></script><script src="./script.js"></script></body></html>
