<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>テスト対策コマ登録 | RED天王台教室</title><link rel="stylesheet" href="../common.css?v=20261010-2"><link rel="stylesheet" href="./style.css?v=20261009-11"></head><body data-site-home="../"><div data-site-header></div><main class="content"><div class="page-title"><h1>⏰ テスト対策コマ登録</h1></div><form id="form"><div data-common-block="student-info"></div><section class="card"><div class="two"><label>学校名 <b>必須</b><select id="school"></select></label><label>学年 <b>必須</b><select id="grade"></select></label><label>テスト期間<input id="testDateDisplay" type="text" readonly inputmode="none" aria-label="テスト開始日・テスト最終日（スプレッドシート設定）"></label><label>テスト対策開始日<input id="startDate" type="text" readonly inputmode="none" aria-label="テスト対策開始日（テスト最終日を含む14日間）"></label><p id="configMessage" class="config-message" role="status">学校名と学年を選択してください。</p><div id="calendarWrap"></div></div></section><div data-common-block="other"></div><p id="error" class="error" role="alert"></p><div class="buttons"><button class="primary" type="submit">確認画面へ</button></div></form><section id="confirm" class="card hidden"><h2>入力内容の確認</h2><div id="summary"></div><div class="actions"><button id="back" class="secondary">入力に戻る</button><button id="submit" class="primary">この内容で登録する</button></div><p id="loading" class="hidden">登録しています…</p></section><section id="success" class="card success-card hidden" aria-live="polite"><div class="success-mark" aria-hidden="true">✓</div><h2>申請を受け付けました</h2></section></main><script src="../common.js"></script><script src="./script.js?v=20261009-7"></script></body></html>
