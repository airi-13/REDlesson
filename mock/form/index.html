<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>外部試験受験登録 | RED天王台教室</title>
<link rel="stylesheet" href="../../common.css?v=20261010-4">
<style>
.exam-type{font-size:1.1rem;font-weight:800;padding:14px;border-radius:10px;background:#fff4f4;border:1px solid #ffd5d5}
.field input[type=date]{width:100%;box-sizing:border-box}
.hidden{display:none!important}
#confirmPanel .summary-row{padding:10px 0;border-bottom:1px solid #e7e7e7}
#confirmPanel .summary-label{font-size:.85rem;color:#667085}
.success-card{text-align:center}
.success-mark{color:#239447;font-size:3rem;font-weight:800;line-height:1.2}
.success-card h2{text-align:center}
</style>
</head>
<body data-site-home="../../">
<div data-site-header></div>
<main class="content">
  <div class="page-title"><h1>外部試験受験登録</h1></div>
  <form id="examForm" novalidate>
    <div data-common-block="student-info"></div>
    <section class="card">
      <div class="field">
        <label>外部試験 <span class="required">必須</span></label>
        <div id="examTypeLabel" class="exam-type">読み込み中</div>
      </div>
      <div class="field">
        <label for="examDate">受験日 <span class="required">必須</span></label>
        <input id="examDate" type="date" required>
        <p id="examDateError" class="error"></p>
      </div>
    </section>
    <div data-common-block="other"></div>
    <p id="formError" class="error" role="alert"></p>
    <div class="buttons"><button class="primary-button" type="submit">入力内容を確認する</button></div>
  </form>
  <section id="confirmPanel" class="card hidden">
    <h2 class="section-title">入力内容の確認</h2>
    <div id="summary"></div>
    <div class="confirm-actions">
      <button id="backButton" class="secondary-button" type="button">入力画面に戻る</button>
      <button id="submitButton" class="primary-button" type="button">この内容で登録する</button>
    </div>
    <p id="loading" class="loading hidden">登録しています。しばらくお待ちください。</p>
  </section>
  <section id="successPanel" class="card success-card hidden" aria-live="polite">
    <div class="success-mark" aria-hidden="true">✓</div>
    <h2>申請を受け付けました。</h2>
    <p>入力いただいたメールアドレスに受付確認メールを送信します。</p>
    <a class="primary-button link-button" href="../">外部試験一覧へ戻る</a>
  </section>
  <footer>© RED天王台教室</footer>
</main>
<script src="../../common.js?v=20261011-1"></script>
<script src="./script.js?v=20261012-1"></script>
</body>
</html>
