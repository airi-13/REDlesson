<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- スマートフォン対応 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="自立学習RED 天王台教室"
  >

  <title>自立学習RED 天王台教室</title>

  <link rel="stylesheet" href="./common.css">
  <style>
    .announcements{margin:18px auto 22px;width:min(900px,100%);padding:0 16px}
    .announcements[hidden]{display:none}
    .announcements h2{font-size:1.1rem;margin:0 0 10px}
    .announcement-item{background:#fff;border:1px solid #d9e0e6;border-radius:12px;margin:0 0 9px;overflow:hidden}
    .announcement-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px}
    .announcement-target{flex:0 0 auto;background:#eef2f5;color:#4c5963;border-radius:6px;padding:3px 7px;font-size:.76rem;font-weight:700}
    .announcement-target-all{background:#fff0f0;color:#e60012}
    .announcement-title{font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
    .announcement-detail{border:0;background:#f2f5f7;color:#303c44;padding:8px 12px;border-radius:8px;font-weight:700;white-space:nowrap}
    .announcement-body{padding:0 14px 15px;white-space:pre-wrap;overflow-wrap:anywhere;color:#39464f}
    .announcement-body[hidden]{display:none}
    @media(max-width:560px){.announcements{padding:0 12px}.announcement-head{gap:7px;padding:11px}.announcement-detail{padding:8px;font-size:.8rem}.announcement-target{font-size:.7rem}}
  </style>

</head>

<body data-site-home="./">

  <div id="loginGate" style="position:fixed;inset:0;background:#f5f7f8;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div style="width:100%;max-width:420px;background:#fff;border-radius:18px;padding:30px 22px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center;">
      <div style="font-size:2.2rem;">🔐</div>
      <h1 style="font-size:1.35rem;margin:8px 0;">自立学習RED 天王台教室</h1>
      <p style="color:#666;margin:0 0 18px;">教室専用ページです。<br>生徒番号上5桁を入力してください。</p>
      <input id="sitePassword" type="password" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="生徒番号上5桁" style="width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:1.1rem;text-align:center;">
      <button id="siteLogin" type="button" style="width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:#E60012;color:#fff;font-size:1rem;font-weight:700;">入る</button>
      <p id="siteLoginError" style="color:#c62828;min-height:1.5em;margin:10px 0 0;"></p>
    </div>
  </div>

  <div id="siteContent" style="display:none;">
  <div data-site-header></div>

  <main>

    <section id="announcements" class="announcements" aria-labelledby="announcementsTitle" hidden>
      <h2 id="announcementsTitle">📢 お知らせ</h2>
      <div id="announcementList" class="announcement-list"></div>
    </section>

    <nav class="menu" aria-label="教室メニュー">

      <div class="application-buttons">
      <a class="menu-button" href="./absence/">
        <span class="title">✏️ 欠席・振替申請</span>
        <span class="description">欠席登録・振替授業の申請</span>
      </a>

      <a class="menu-button" href="./textbook/">
        <span class="title">📚 テキスト購入申請</span>
        <span class="description">教材の購入を申請</span>
      </a>

      <a class="menu-button" href="./test/">
        <span class="title">📝 テスト登録</span>
        <span class="description">定期テスト・模試に関する登録</span>
      </a>

      <a class="menu-button" href="./plan-change/">
        <span class="title">🔄 プラン変更申請</span>
        <span class="description">来月以降のプラン・受講教科を変更</span>
      </a>
      </div>

      <a class="menu-button" href="./calendar/">
        <span class="title">📅 年間カレンダー</span>
        <span class="description">
          教室の年間予定を確認
        </span>
      </a>

      <a class="menu-button" href="./tuition/">
        <span class="title">💰 料金シミュレーション</span>
        <span class="description">
          授業料・講習・テスト対策などの料金を確認
        </span>
      </a>

      <a class="menu-button" href="./lesson/">
        <span class="title">📝 授業管理</span>
        <span class="description">
          生徒・授業などの管理
        </span>
      </a>

    </nav>

  </main>

  <footer class="footer">
    <a class="menu-button" href="https://apps.apple.com/jp/app/%E8%87%AA%E7%AB%8B%E5%AD%A6%E7%BF%92red%E3%83%9E%E3%82%A4%E3%83%9A%E3%83%BC%E3%82%B8/id6741319329" target="_blank" rel="noopener" style="display:block;max-width:900px;margin:0 auto 18px;">
      <span class="title">💳 請求確認</span>
      <span class="description">自立学習REDマイページで請求内容を確認</span>
    </a>
    自立学習RED 天王台教室
  </footer>

  </div>
  <script>
    (() => {
      const PASS = "11391";
      const gate = document.getElementById("loginGate");
      const content = document.getElementById("siteContent");
      const input = document.getElementById("sitePassword");
      const button = document.getElementById("siteLogin");
      const error = document.getElementById("siteLoginError");
      function unlock(){
        if(input.value.trim() !== PASS){ error.textContent = "生徒番号上5桁が正しくありません。"; return; }
        gate.style.display = "none"; content.style.display = "block";
        sessionStorage.setItem("redLessonAuth","ok");
      }
      button.addEventListener("click",unlock);
      input.addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
      if(sessionStorage.getItem("redLessonAuth")==="ok"){gate.style.display="none";content.style.display="block";}
      else setTimeout(()=>input.focus(),100);
    })();
  </script>
  <script>
    (() => {
      const section = document.getElementById("announcements");
      const list = document.getElementById("announcementList");
      if (!section || !list) return;
      const gasUrl = "https://script.google.com/macros/s/AKfycbwpSTb4WiArofE1-Ajj6HchKU3RvJ_vCkHlykU1okVnYO2NWBWATQb1e3PsBL_NsyTB/exec";
      const callbackName = "redAnnouncementsCallback";
      window[callbackName] = (result) => {
        try {
          if (!result || !result.success || !Array.isArray(result.announcements) || !result.announcements.length) return;
          list.innerHTML = result.announcements.map((item, index) => {
            const rawTarget = String(item.target || "全員");
            const target = escapeHtml(rawTarget);
            const targetClass = rawTarget === "全員" ? " announcement-target-all" : "";
            const title = escapeHtml(item.title || "");
            const body = escapeHtml(item.content || "");
            return '<article class="announcement-item">' +
              '<div class="announcement-head"><span class="announcement-target' + targetClass + '">' + target + '</span>' +
              '<div class="announcement-title">' + title + '</div>' +
              '<button type="button" class="announcement-detail" aria-expanded="false" aria-controls="announcement-body-' + index + '">詳細</button></div>' +
              '<div id="announcement-body-' + index + '" class="announcement-body" hidden>' + body + '</div></article>';
          }).join("");
          section.hidden = false;
          list.querySelectorAll(".announcement-detail").forEach(button => {
            button.addEventListener("click", () => {
              const body = document.getElementById(button.getAttribute("aria-controls"));
              const open = button.getAttribute("aria-expanded") !== "true";
              button.setAttribute("aria-expanded", String(open));
              button.textContent = open ? "閉じる" : "詳細";
              body.hidden = !open;
            });
          });
        } catch (error) { console.error("お知らせの表示に失敗しました", error); }
      };
      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
          "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
        }[char]));
      }
      const script = document.createElement("script");
      script.src = gasUrl + "?action=announcements&callback=" + callbackName + "&_=" + Date.now();
      script.onerror = () => console.warn("お知らせを読み込めませんでした");
      document.head.appendChild(script);
    })();
  </script>
  <script src="./common.js"></script>
</body>
</html>
