<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>テスト範囲登録 | RED天王台教室</title><link rel="stylesheet" href="../common.css?v=20261009-7"><link rel="stylesheet" href="./style.css?v=20261009-1"></head><body data-site-home="../"><div data-site-header></div><main class="content"><div class="page-title"><h1>📝 テスト範囲登録</h1></div><form id="rangeForm" novalidate><div data-common-block="student-info"></div><section class="card"><div class="two-column"><div class="field"><label for="school">学校名 <span class="required">必須</span></label><select id="school"><option value="">学校を選択してください</option></select><p id="schoolError" class="error"></p></div><div class="field"><label for="grade">学年 <span class="required">必須</span></label><select id="grade"><option value="">学年を選択してください</option></select><p id="gradeError" class="error"></p></div></div><h3 class="section-title">テスト範囲</h3><p class="help">テスト範囲がある教科だけ入力してください。ページ番号は半角数字で入力します。</p><div id="subjects"></div></section><div data-common-block="other"></div><div class="buttons"><button id="confirmButton" class="primary-button" type="submit">入力内容を確認する</button></div></form><section id="confirmation" class="card hidden"><h2 class="section-title">入力内容の確認</h2><div id="confirmationItems" class="confirmation-list"></div><div class="confirm-actions"><button id="backButton" class="secondary-button" type="button">入力画面に戻る</button><button id="submitButton" class="primary-button" type="button">この内容で登録する</button></div><p id="loading" class="loading hidden">登録しています。しばらくお待ちください。</p></section><section id="success" class="card success-card hidden"><div class="success-mark">✓</div><h2>テスト範囲を登録しました</h2><p>テスト範囲の登録を受け付けました。</p></section><footer>© RED天王台教室</footer></main><script src="../common.js"></script><script src="./script.js"></script></body></html>
