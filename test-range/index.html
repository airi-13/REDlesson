<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E60012">
<title>テスト範囲登録 | RED天王台教室</title>
<link rel="stylesheet" href="../common.css">
<link rel="stylesheet" href="./style.css">
</head>
<body data-site-home="../">
<div data-site-header></div>

<main class="page">
  <section class="card intro-card">
    <h1>📝 テスト範囲登録</h1>
    <p class="intro-text">定期テストの範囲を登録してください。複数の教科・範囲をまとめて登録できます。</p>
  </section>

  <form id="rangeForm" novalidate>
    <section class="card">
      

      <div class="field">
        <label for="studentId">生徒番号 <span class="required">必須</span></label>
        <input id="studentId" type="text" inputmode="numeric" autocomplete="off" placeholder="例：113900000">
        <p id="studentIdError" class="error"></p>
      </div>

      <div class="field">
        <label for="studentName">氏名 <span class="required">必須</span></label>
        <input id="studentName" type="text" autocomplete="name" placeholder="例：山田 太郎">
        <p id="studentNameError" class="error"></p>
      </div>

      <div class="two-column">
        <div class="field">
          <label for="school">学校名 <span class="required">必須</span></label>
          <select id="school">
            <option value="">学校を選択してください</option>
          </select>
          <p id="schoolError" class="error"></p>
        </div>

        <div class="field">
          <label for="grade">学年 <span class="required">必須</span></label>
          <select id="grade">
            <option value="">学年を選択してください</option>
          </select>
          <p id="gradeError" class="error"></p>
        </div>
      </div>

  </section>

    <section class="card">
      <h2 class="section-title">テスト範囲</h2>
      <p class="help">テスト範囲がある教科だけ入力してください。ページ番号は半角数字で入力します。</p>

      <div id="subjects"></div>
    </section>

    <section class="card">
      <div class="field">
        <label for="notes">連絡事項</label>
        <textarea id="notes" rows="4" placeholder="テストについて伝えておきたいことがあれば入力してください。"></textarea>
      </div>
      <div class="field">
        <label for="email">メールアドレス <span class="required">必須</span></label>
        <input id="email" type="email" autocomplete="email" placeholder="確認メールを受け取るアドレス">
        <p id="emailError" class="error"></p>
      </div>
    </section>

    <section class="card submit-card">
      <p id="formError" class="error form-error"></p>
      <button id="confirmButton" class="primary-button" type="submit">入力内容を確認する</button>
    </section>
  </form>

  <section id="confirmation" class="card hidden">
    <h2 class="section-title">入力内容の確認</h2>
    <div id="confirmationItems" class="confirmation-list"></div>
    <div class="confirm-actions">
      <button id="backButton" class="secondary-button" type="button">入力画面に戻る</button>
      <button id="submitButton" class="primary-button" type="button">この内容で登録する</button>
    </div>
    <p id="loading" class="loading hidden">登録しています。しばらくお待ちください。</p>
  </section>

  <section id="success" class="card success-card hidden">
    <div class="success-mark">✓</div>
    <h2>テスト範囲を登録しました</h2>
    <p>テスト範囲の登録を受け付けました。</p>
  </section>

  <footer>© RED天王台教室</footer>
</main>

<script src="../common.js"></script>
<script src="./script.js"></script>
</body>
</html>
