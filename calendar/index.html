<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="自立学習RED 天王台教室 年間カレンダー">
  <title>年間カレンダー | 自立学習RED 天王台教室</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    :root{--red:#e60012;--line:#dfe4e8;--muted:#66727b;--blue:#eaf3ff;--yellow:#fff5d8;--green:#e8f7ec;--pink:#ffebee}
    *{box-sizing:border-box}
    body{margin:0;background:#f5f7f8;color:#263238;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(1120px,100%);margin:0 auto;padding:22px 16px 40px}
    .page-heading{display:flex;align-items:center;gap:12px;margin:0 0 6px;font-size:clamp(1.35rem,3vw,1.8rem)}
    .lead{color:var(--muted);margin:0 0 20px;line-height:1.7}
    .toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
    .year-controls{display:flex;align-items:center;gap:10px}
    .year-controls button,.today-button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;color:#263238}
    #yearLabel{font-size:1.15rem;font-weight:800;min-width:140px;text-align:center}
    .legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.84rem;color:#4d5961}
    .legend-item{display:flex;align-items:center;gap:6px}
    .swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
    .calendar-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;max-width:760px;margin:0 auto}
    .month-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
    .month-title{padding:10px 12px;background:#f0f3f5;font-weight:800;display:flex;justify-content:space-between;align-items:center}
    .month-title small{font-weight:500;color:var(--muted)}
    .month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:8px;gap:3px}
    .weekday{text-align:center;font-size:.72rem;color:#65717a;padding:4px 0;font-weight:700}
    .weekday:first-child{color:#d32f2f}.weekday:last-child{color:#1976d2}
    .day{position:relative;min-height:64px;border:1px solid transparent;border-radius:7px;background:#fff;padding:4px 2px;text-align:center;cursor:pointer;color:#263238;font:inherit;overflow-wrap:anywhere}
    .day:hover{border-color:#b7c1c8;background:#f7f9fa}
    .day.empty{pointer-events:none}
    .day.sunday .day-number{color:#d32f2f}.day.saturday .day-number{color:#1976d2}
    .day.today{border-color:var(--red);font-weight:800}
    .day.selected{outline:2px solid var(--red);outline-offset:-2px}
    .day-number{display:flex;align-items:center;justify-content:center;width:27px;height:27px;margin:0 auto;font-size:.82rem;line-height:1.2;border-radius:50%}.day.closed-day .day-number{background:#ffe0e3;color:#b42332;font-weight:800}.day.deadline-day{background:#d92d20!important;color:#fff!important;border-color:#d92d20}.day.deadline-day .day-number{background:#d92d20;color:#fff;font-weight:800}.day .event-title-label{display:block;margin:3px auto 0;max-width:100%;font-size:.62rem;line-height:1.2;overflow-wrap:anywhere;font-weight:700}.day .event-title-label.exam-title{color:#16803c}.day .event-title-label.deadline-title{color:#fff}.day .event-dot{display:none}
    .event-dot{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:var(--red)}
    .day.has-event{background:#fff9f9}
    .day-type-holiday{background:var(--pink)}.day-type-class{background:var(--blue)}.day-type-event{background:var(--yellow)}.day-type-other{background:var(--green)}
    .detail-panel{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
    .detail-panel h2{font-size:1.08rem;margin:0 0 12px}
    .detail-date{font-size:1rem;font-weight:800;margin-bottom:10px}
    .event-list{display:grid;gap:9px}
    .event-item{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:9px;padding:11px 12px}
    .event-item .event-type{font-size:.75rem;color:var(--muted);font-weight:700;margin-bottom:3px}
    .event-item .event-title{font-weight:800}
    .event-item .event-description{white-space:pre-wrap;overflow-wrap:anywhere;color:#4c5962;margin-top:5px;font-size:.9rem}
    .empty-detail{color:var(--muted);margin:0}
    .status{margin:0 0 14px;padding:11px 13px;border-radius:10px;background:#fff5d8;color:#6d5512;font-size:.9rem;line-height:1.6}
    .status[hidden]{display:none}
    .status.error{background:#ffebee;color:#9b1c28}
    .loading{opacity:.7}
    @media(max-width:820px){.calendar-grid{grid-template-columns:minmax(0,1fr)}}
    @media(max-width:520px){main{padding:16px 10px 28px}.calendar-grid{grid-template-columns:1fr;gap:11px}.month-grid{padding:8px 5px;gap:2px}.day{min-height:48px}.toolbar{padding:12px}.year-controls{width:100%;justify-content:space-between}.year-controls select{flex:1;min-width:0!important;max-width:65%}.legend{gap:7px 10px}.detail-panel{padding:14px}}
  </style>
</head>
<body data-site-home="../">
  <div id="loginGate" style="position:fixed;inset:0;background:#f5f7f8;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
    <div style="width:100%;max-width:420px;background:#fff;border-radius:18px;padding:30px 22px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center">
      <div style="font-size:2.2rem">🔐</div>
      <h1 style="font-size:1.35rem;margin:8px 0">自立学習RED 天王台教室</h1>
      <p style="color:#666;margin:0 0 18px">教室専用ページです。<br>生徒番号上5桁を入力してください。</p>
      <input id="sitePassword" type="password" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="生徒番号上5桁" style="width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:1.1rem;text-align:center">
      <button id="siteLogin" type="button" style="width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:#E60012;color:#fff;font-size:1rem;font-weight:700">入る</button>
      <p id="siteLoginError" style="color:#c62828;min-height:1.5em;margin:10px 0 0"></p>
    </div>
  </div>
  <div id="siteContent" style="display:none">
    <div data-site-header></div>
    <main>
      <h1 class="page-heading">📅 年間カレンダー</h1>
      <p class="lead">今月の教室予定を表示します。プルダウンから見たい月に切り替えられます。日付を押すと、その日の予定が表示されます。</p>
      <div class="toolbar">
        <div class="year-controls"><label for="schoolSelect" style="font-weight:700">表示する予定</label><select id="schoolSelect" aria-label="表示する予定" style="min-width:190px;padding:10px 12px;border:1px solid #dfe4e8;border-radius:9px;background:#fff;font:inherit"><option value="" selected>ー</option><option value="我孫子中">我孫子中</option><option value="湖北台中">湖北台中</option><option value="白山中">白山中</option><option value="その他">その他</option></select></div>
        <div class="year-controls"><label for="monthSelect" style="font-weight:700">表示する月</label><select id="monthSelect" aria-label="表示する月" style="min-width:190px;padding:10px 12px;border:1px solid #dfe4e8;border-radius:9px;background:#fff;font:inherit"></select></div>
        <button id="todayButton" class="today-button" type="button">今日の月へ</button>
        <div class="legend" aria-label="予定の凡例">
          <span class="legend-item"><i class="swatch" style="background:#ffccd2"></i>休校・休日</span>
          <span class="legend-item"><i class="swatch" style="background:#cfe3ff"></i>授業</span>
          <span class="legend-item"><i class="swatch" style="background:#ffe7a3"></i>講習・テスト</span>
          <span class="legend-item"><i class="swatch" style="background:#c9efd2"></i>その他</span>
        </div>
      </div>
      <p id="dataStatus" class="status" role="status">予定を読み込んでいます…</p>
      <section id="calendarGrid" class="calendar-grid" aria-label="年間カレンダー"></section>
      <section class="detail-panel" aria-live="polite">
        <h2>選択した日の予定</h2>
        <div id="detailDate" class="detail-date">日付を選択してください</div>
        <div id="eventList" class="event-list"><p class="empty-detail">カレンダーの日付を押すと、予定の詳細がここに表示されます。</p></div>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const PASS = "11391";
      const gate = document.getElementById("loginGate");
      const content = document.getElementById("siteContent");
      const input = document.getElementById("sitePassword");
      const button = document.getElementById("siteLogin");
      const error = document.getElementById("siteLoginError");
      function unlock() {
        if (input.value.trim() !== PASS) { error.textContent = "生徒番号上5桁が正しくありません。"; return; }
        gate.style.display = "none"; content.style.display = "block";
        sessionStorage.setItem("redLessonAuth", "ok");
        window.dispatchEvent(new Event("red-calendar-unlocked"));
      }
      button.addEventListener("click", unlock);
      input.addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
      if (sessionStorage.getItem("redLessonAuth") === "ok") { gate.style.display = "none"; content.style.display = "block"; }
      else setTimeout(() => input.focus(), 100);
    })();
  </script>
  <script src="../common.js?v=20261017-calendar1"></script>
  <script>
    (() => {
      const grid = document.getElementById("calendarGrid");
      const monthSelect = document.getElementById("monthSelect");
      const schoolSelect = document.getElementById("schoolSelect");
      const status = document.getElementById("dataStatus");
      const detailDate = document.getElementById("detailDate");
      const eventList = document.getElementById("eventList");
      const today = new Date();
      let viewYear = today.getFullYear();
      let viewMonth = today.getMonth();
      let events = [];
      let selectedDate = "";
      const weekdays = ["日","月","火","水","木","金","土"];
      const colors = { "休校":"holiday", "休日":"holiday", "授業":"class", "講習":"event", "テスト":"event", "その他":"other" };
      const pad = n => String(n).padStart(2, "0");
      const dateKey = (y,m,d) => y + "-" + pad(m + 1) + "-" + pad(d);
      const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      function eventKind(item) {
        const type = String(item.type || item.category || "その他");
        if (/休校|休日|休業/.test(type)) return "holiday";
        if (/授業/.test(type)) return "class";
        if (/講習|テスト|模試|対策/.test(type)) return "event";
        return "other";
      }
      function isSharedEvent(e) { const scope = String(e.school || e.target || e.scope || "全体").trim(); return !scope || scope === "全体" || scope === "全体共通" || scope === "共通" || scope === "全員"; }
      function isVisibleEvent(e) { const selected = schoolSelect.value; return !selected || isSharedEvent(e) || String(e.school || e.target || e.scope || "").trim() === selected; }
      function rawEventsOn(key) { return events.filter(e => String(e.date || e.startDate || "") === key || (e.startDate && e.endDate && key >= e.startDate && key <= e.endDate)); }
      function eventsOn(key) { return rawEventsOn(key).filter(isVisibleEvent); }
      function isOpeningEvent(e) { return /開校|開室|通常授業あり/.test(String(e.type || e.category || "") + " " + String(e.title || e.name || "")); }
      function isClosingEvent(e) { return /休校|休日|休業/.test(String(e.type || e.category || "") + " " + String(e.title || e.name || "")); }
      function isClosedOn(key) { const applicable = eventsOn(key); if (applicable.some(isOpeningEvent)) return false; if (applicable.some(isClosingEvent)) return true; const dow = new Date(key + "T00:00:00").getDay(); return dow === 0 || dow === 1; }
      function renderDetail(key) {
        selectedDate = key;
        const [y,m,d] = key.split("-").map(Number);
        detailDate.textContent = y + "年" + m + "月" + d + "日（" + weekdays[new Date(y,m-1,d).getDay()] + "）";
        const dayEvents = eventsOn(key);
        eventList.innerHTML = dayEvents.length ? dayEvents.map(e => '<article class="event-item"><div class="event-type">' + escapeHtml(e.type || e.category || "予定") + '</div><div class="event-title">' + escapeHtml(e.title || e.name || "予定") + '</div>' + (e.description || e.content ? '<div class="event-description">' + escapeHtml(e.description || e.content) + '</div>' : "") + '</article>').join("") : '<p class="empty-detail">この日の登録予定はありません。</p>';
        grid.querySelectorAll(".day.selected").forEach(el => el.classList.remove("selected"));
        const target = grid.querySelector('[data-date="' + key + '"]');
        if (target) target.classList.add("selected");
      }
      function renderCalendar() {
        monthSelect.innerHTML = "";
        for (let offset = -12; offset <= 12; offset++) {
          const d = new Date(today.getFullYear(), today.getMonth() + offset, 1);
          const y = d.getFullYear(), m = d.getMonth();
          const option = document.createElement("option");
          option.value = y + "-" + pad(m + 1);
          option.textContent = y + "年" + (m + 1) + "月";
          if (y === viewYear && m === viewMonth) option.selected = true;
          monthSelect.appendChild(option);
        }
        grid.innerHTML = "";
        const year = viewYear, monthIndex = viewMonth, month = monthIndex + 1;
        const firstDay = new Date(year, monthIndex, 1).getDay();
        const days = new Date(year, monthIndex + 1, 0).getDate();
        const card = document.createElement("article");
        card.className = "month-card";
        card.innerHTML = '<div class="month-title"><span>' + year + "年 " + month + "月</span><small>日付を選択して予定を確認</small></div><div class="month-grid">' + weekdays.map(w => '<div class="weekday">' + w + '</div>').join("") + '</div>';
        const monthGrid = card.querySelector(".month-grid");
        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement("div");
          empty.className = "day empty";
          monthGrid.appendChild(empty);
        }
        for (let d = 1; d <= days; d++) {
          const key = dateKey(year, monthIndex, d);
          const dayEvents = eventsOn(key);
          const date = new Date(year, monthIndex, d);
          const btn = document.createElement("button");
          btn.type = "button";
          const isClosed = isClosedOn(key);
          const hasDeadline = dayEvents.some(e => String(e.type || e.category || "").trim() === "〆切");
          btn.className = "day" + (date.getDay() === 0 ? " sunday" : "") + (date.getDay() === 1 ? " monday" : "") + (date.getDay() === 6 ? " saturday" : "") + (isClosed ? " closed-day" : "") + (hasDeadline ? " deadline-day" : "") + (key === dateKey(today.getFullYear(), today.getMonth(), today.getDate()) ? " today" : "") + (dayEvents.length ? " has-event day-type-" + eventKind(dayEvents[0]) : "") + (key === selectedDate ? " selected" : "");
          btn.dataset.date = key;
          btn.setAttribute("aria-label", year + "年" + month + "月" + d + "日" + (isClosed ? "、休校日" : "") + (dayEvents.length ? "、予定" + dayEvents.length + "件" : ""));
          const titleLabels = dayEvents.filter(e => ["模試","検定","テスト","〆切"].includes(String(e.type || e.category || "").trim())).map(e => { const isDeadline = String(e.type || e.category || "").trim() === "〆切"; return '<span class="event-title-label ' + (isDeadline ? "deadline-title" : "exam-title") + '">' + escapeHtml(e.title || e.name || e.type || "") + '</span>'; }).join("");
          btn.innerHTML = '<span class="day-number">' + d + '</span>' + titleLabels;
          btn.addEventListener("click", () => renderDetail(key));
          monthGrid.appendChild(btn);
        }
        grid.appendChild(card);
        if (selectedDate && selectedDate.slice(0,7) === year + "-" + pad(month)) renderDetail(selectedDate);
        else {
          selectedDate = "";
          detailDate.textContent = year + "年" + month + "月";
          eventList.innerHTML = '<p class="empty-detail">カレンダーの日付を押すと、予定の詳細がここに表示されます。</p>';
        }
      }
      function loadEvents() {
        status.hidden = false;
        status.classList.remove("error");
        status.textContent = "予定を読み込んでいます…";
        const callbackName = "redCalendarCallback";
        window[callbackName] = result => {
          try {
            if (!result || result.success !== true || !Array.isArray(result.events)) throw new Error("カレンダー用の予定データが取得できませんでした。");
            events = result.events.map(e => ({
              date: String(e.date || e.startDate || ""),
              startDate: String(e.startDate || ""),
              endDate: String(e.endDate || ""),
              title: String(e.title || e.name || ""),
              type: String(e.type || e.category || "その他"),
              description: String(e.description || e.content || ""),
              school: String(e.school || e.target || e.scope || "全体")
            })).filter(e => e.date || e.startDate);
            status.hidden = true;
            renderCalendar();
            const nowKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
            if (viewYear === today.getFullYear() && viewMonth === today.getMonth()) renderDetail(nowKey);
          } catch (err) {
            status.classList.add("error");
            status.textContent = "予定データの形式を確認できませんでした。スプレッドシート連携の設定が必要です。";
            renderCalendar();
          }
        };
        const script = document.createElement("script");
        script.src = window.RED.GAS_URL + "?action=calendar&callback=" + callbackName + "&_=" + Date.now();
        script.onerror = () => {
          status.classList.add("error");
          status.textContent = "予定を取得できませんでした。次の手順でGoogleスプレッドシートとGASを接続します。";
          renderCalendar();
        };
        document.head.appendChild(script);
      }
      schoolSelect.addEventListener("change", () => { selectedDate = ""; renderCalendar(); });
      monthSelect.addEventListener("change", () => {
        const parts = monthSelect.value.split("-").map(Number);
        viewYear = parts[0];
        viewMonth = parts[1] - 1;
        selectedDate = "";
        renderCalendar();
      });
      document.getElementById("todayButton").addEventListener("click", () => {
        viewYear = today.getFullYear();
        viewMonth = today.getMonth();
        selectedDate = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
        renderCalendar();
        renderDetail(selectedDate);
      });
      renderCalendar();
      renderDetail(dateKey(today.getFullYear(), today.getMonth(), today.getDate()));
      loadEvents();
    })();
  </script>
</body>
</html>
